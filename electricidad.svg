<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="ebg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a2e"/>
      <stop offset="100%" stop-color="#1a1a3e"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#ebg)"/>
  <!-- Circuit board traces -->
  <g stroke="#1e3a5f" stroke-width="1" opacity="0.3" fill="none">
    <line x1="0" y1="50" x2="400" y2="50"/>
    <line x1="0" y1="100" x2="400" y2="100"/>
    <line x1="0" y1="200" x2="400" y2="200"/>
    <line x1="0" y1="250" x2="400" y2="250"/>
    <line x1="50" y1="0" x2="50" y2="300"/>
    <line x1="150" y1="0" x2="150" y2="300"/>
    <line x1="250" y1="0" x2="250" y2="300"/>
    <line x1="350" y1="0" x2="350" y2="300"/>
  </g>
  <!-- Main circuit path -->
  <path d="M60,150 L120,150 L120,80 L280,80 L280,150 L340,150 L340,220 L120,220 L120,150" fill="none" stroke="#4fc3f7" stroke-width="2.5" opacity="0.6"/>
  <!-- Battery -->
  <g transform="translate(60, 138)">
    <line x1="0" y1="0" x2="0" y2="24" stroke="#ffd54f" stroke-width="3"/>
    <line x1="-8" y1="6" x2="8" y2="6" stroke="#ffd54f" stroke-width="2"/>
    <line x1="-4" y1="18" x2="4" y2="18" stroke="#ffd54f" stroke-width="2"/>
    <text x="-2" y="-5" fill="#ffd54f" font-size="8" font-family="Arial">+</text>
    <text x="-2" y="36" fill="#ffd54f" font-size="8" font-family="Arial">-</text>
  </g>
  <!-- Resistor -->
  <g transform="translate(170, 72)">
    <path d="M0,8 L8,8 L12,0 L20,16 L28,0 L36,16 L44,0 L52,16 L56,8 L64,8" fill="none" stroke="#ff8a65" stroke-width="2"/>
    <text x="20" y="-5" fill="#ff8a65" font-size="9" font-family="Arial">R</text>
  </g>
  <!-- Lightbulb (right side) -->
  <g transform="translate(320, 130)">
    <circle cx="20" cy="20" r="18" fill="none" stroke="#ffd54f" stroke-width="2">
      <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="20" cy="20" r="12" fill="#ffd54f" opacity="0.15">
      <animate attributeName="opacity" values="0.1;0.3;0.1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="20" cy="20" r="25" fill="#ffd54f" opacity="0.05">
      <animate attributeName="r" values="25;35;25" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.05;0.12;0.05" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <!-- Filament -->
    <path d="M16,26 Q18,18 20,26 Q22,18 24,26" fill="none" stroke="#ffd54f" stroke-width="1.5">
      <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="1.5s" repeatCount="indefinite"/>
    </path>
  </g>
  <!-- Electron particles flowing -->
  <circle r="3" fill="#4fc3f7" opacity="0.8">
    <animateMotion path="M60,150 L120,150 L120,80 L280,80 L280,150 L340,150" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle r="3" fill="#4fc3f7" opacity="0.6">
    <animateMotion path="M60,150 L120,150 L120,80 L280,80 L280,150 L340,150" dur="4s" repeatCount="indefinite" begin="1.3s"/>
  </circle>
  <circle r="3" fill="#4fc3f7" opacity="0.7">
    <animateMotion path="M60,150 L120,150 L120,80 L280,80 L280,150 L340,150" dur="4s" repeatCount="indefinite" begin="2.6s"/>
  </circle>
  <!-- Return path electrons -->
  <circle r="2.5" fill="#00e5ff" opacity="0.5">
    <animateMotion path="M340,220 L120,220 L120,150 L60,150" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle r="2.5" fill="#00e5ff" opacity="0.4">
    <animateMotion path="M340,220 L120,220 L120,150 L60,150" dur="4s" repeatCount="indefinite" begin="2s"/>
  </circle>
  <!-- Lightning bolt -->
  <g transform="translate(190, 160)" opacity="0.7">
    <polygon points="15,0 5,18 12,18 0,38 20,16 13,16 25,0" fill="#ffd54f">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
    </polygon>
  </g>
  <!-- V = I * R formula -->
  <text x="200" y="258" text-anchor="middle" fill="#4fc3f7" font-family="Arial, sans-serif" font-size="16" font-weight="bold" opacity="0.7">
    V = I . R
    <animate attributeName="opacity" values="0.5;0.9;0.5" dur="3s" repeatCount="indefinite"/>
  </text>
  <text x="200" y="276" text-anchor="middle" fill="#4fc3f7" font-family="Arial, sans-serif" font-size="12" font-weight="bold" letter-spacing="2">ELECTRICIDAD</text>
</svg>
