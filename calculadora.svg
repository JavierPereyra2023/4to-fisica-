<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="cbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#1b2838"/>
    </linearGradient>
    <linearGradient id="calcBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#37474f"/>
      <stop offset="100%" stop-color="#263238"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b5e20"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#cbg)"/>
  <!-- Floating formulas background -->
  <text x="30" y="30" fill="#1e3a5f" font-family="Arial" font-size="11" opacity="0.4">E = mc2</text>
  <text x="300" y="45" fill="#1e3a5f" font-family="Arial" font-size="10" opacity="0.3">F = ma</text>
  <text x="50" y="270" fill="#1e3a5f" font-family="Arial" font-size="11" opacity="0.3">P = W/t</text>
  <text x="310" y="260" fill="#1e3a5f" font-family="Arial" font-size="10" opacity="0.4">Q = mc.dT</text>
  <!-- Calculator body -->
  <rect x="120" y="30" width="160" height="230" rx="12" fill="url(#calcBody)" stroke="#455a64" stroke-width="2"/>
  <!-- Screen -->
  <rect x="135" y="45" width="130" height="45" rx="5" fill="url(#screen)" opacity="0.9"/>
  <!-- Screen text animated -->
  <text x="255" y="78" text-anchor="end" fill="#a5d6a7" font-family="'Courier New', monospace" font-size="22" font-weight="bold">
    42.0
    <animate attributeName="opacity" values="1;0.7;1" dur="2s" repeatCount="indefinite"/>
  </text>
  <!-- Calculator buttons -->
  <!-- Row 1 -->
  <rect x="135" y="100" width="28" height="24" rx="4" fill="#546e7a"/>
  <text x="149" y="117" text-anchor="middle" fill="#eceff1" font-family="Arial" font-size="12" font-weight="bold">7</text>
  <rect x="168" y="100" width="28" height="24" rx="4" fill="#546e7a"/>
  <text x="182" y="117" text-anchor="middle" fill="#eceff1" font-family="Arial" font-size="12" font-weight="bold">8</text>
  <rect x="201" y="100" width="28" height="24" rx="4" fill="#546e7a"/>
  <text x="215" y="117" text-anchor="middle" fill="#eceff1" font-family="Arial" font-size="12" font-weight="bold">9</text>
  <rect x="234" y="100" width="28" height="24" rx="4" fill="#ff8a65"/>
  <text x="248" y="117" text-anchor="middle" fill="#fff" font-family="Arial" font-size="14" font-weight="bold">/</text>
  <!-- Row 2 -->
  <rect x="135" y="130" width="28" height="24" rx="4" fill="#546e7a"/>
  <text x="149" y="147" text-anchor="middle" fill="#eceff1" font-family="Arial" font-size="12" font-weight="bold">4</text>
  <rect x="168" y="130" width="28" height="24" rx="4" fill="#546e7a"/>
  <text x="182" y="147" text-anchor="middle" fill="#eceff1" font-family="Arial" font-size="12" font-weight="bold">5</text>
  <rect x="201" y="130" width="28" height="24" rx="4" fill="#546e7a"/>
  <text x="215" y="147" text-anchor="middle" fill="#eceff1" font-family="Arial" font-size="12" font-weight="bold">6</text>
  <rect x="234" y="130" width="28" height="24" rx="4" fill="#ff8a65"/>
  <text x="248" y="147" text-anchor="middle" fill="#fff" font-family="Arial" font-size="14" font-weight="bold">x</text>
  <!-- Row 3 -->
  <rect x="135" y="160" width="28" height="24" rx="4" fill="#546e7a"/>
  <text x="149" y="177" text-anchor="middle" fill="#eceff1" font-family="Arial" font-size="12" font-weight="bold">1</text>
  <rect x="168" y="160" width="28" height="24" rx="4" fill="#546e7a"/>
  <text x="182" y="177" text-anchor="middle" fill="#eceff1" font-family="Arial" font-size="12" font-weight="bold">2</text>
  <rect x="201" y="160" width="28" height="24" rx="4" fill="#546e7a"/>
  <text x="215" y="177" text-anchor="middle" fill="#eceff1" font-family="Arial" font-size="12" font-weight="bold">3</text>
  <rect x="234" y="160" width="28" height="24" rx="4" fill="#ff8a65"/>
  <text x="248" y="177" text-anchor="middle" fill="#fff" font-family="Arial" font-size="14" font-weight="bold">-</text>
  <!-- Row 4 -->
  <rect x="135" y="190" width="61" height="24" rx="4" fill="#546e7a"/>
  <text x="165" y="207" text-anchor="middle" fill="#eceff1" font-family="Arial" font-size="12" font-weight="bold">0</text>
  <rect x="201" y="190" width="28" height="24" rx="4" fill="#4fc3f7"/>
  <text x="215" y="207" text-anchor="middle" fill="#0a0a2e" font-family="Arial" font-size="14" font-weight="bold">=</text>
  <rect x="234" y="190" width="28" height="24" rx="4" fill="#ff8a65"/>
  <text x="248" y="207" text-anchor="middle" fill="#fff" font-family="Arial" font-size="14" font-weight="bold">+</text>
  <!-- Animated pressing effect on = button -->
  <rect x="201" y="190" width="28" height="24" rx="4" fill="#fff" opacity="0">
    <animate attributeName="opacity" values="0;0.3;0" dur="3s" repeatCount="indefinite"/>
  </rect>
  <!-- Floating math symbols -->
  <g opacity="0.5">
    <text x="50" y="100" fill="#4fc3f7" font-family="Arial" font-size="24" font-weight="bold">
      +
      <animate attributeName="y" values="100;85;100" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="4s" repeatCount="indefinite"/>
    </text>
    <text x="340" y="130" fill="#ff8a65" font-family="Arial" font-size="28" font-weight="bold">
      =
      <animate attributeName="y" values="130;115;130" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="3.5s" repeatCount="indefinite"/>
    </text>
    <text x="60" y="180" fill="#66bb6a" font-family="Arial" font-size="20">
      %
      <animate attributeName="y" values="180;165;180" dur="5s" repeatCount="indefinite"/>
    </text>
    <text x="330" y="200" fill="#ffd54f" font-family="Arial" font-size="22">
      pi
      <animate attributeName="y" values="200;185;200" dur="4.5s" repeatCount="indefinite"/>
    </text>
  </g>
  <!-- Orbiting particle -->
  <circle r="4" fill="#4fc3f7" opacity="0.6">
    <animate attributeName="cx" values="200;280;200;120;200" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="20;150;280;150;20" dur="8s" repeatCount="indefinite"/>
  </circle>
  <text x="200" y="290" text-anchor="middle" fill="#4fc3f7" font-family="Arial, sans-serif" font-size="12" font-weight="bold" letter-spacing="2">CALCULADORA FISICA</text>
</svg>
