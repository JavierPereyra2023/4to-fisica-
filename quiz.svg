<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="qbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#1a1a3e"/>
    </linearGradient>
    <linearGradient id="trophy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd54f"/>
      <stop offset="100%" stop-color="#f9a825"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#qbg)"/>
  <!-- Confetti particles -->
  <rect x="50" y="30" width="6" height="6" rx="1" fill="#ff5252" opacity="0.7" transform="rotate(30 53 33)">
    <animate attributeName="y" values="30;280" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0" dur="5s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="rotate" from="0 53 33" to="360 53 33" dur="3s" repeatCount="indefinite"/>
  </rect>
  <rect x="150" y="10" width="5" height="5" rx="1" fill="#4fc3f7" opacity="0.6" transform="rotate(45 152 12)">
    <animate attributeName="y" values="10;290" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0" dur="6s" repeatCount="indefinite"/>
  </rect>
  <rect x="300" y="20" width="7" height="4" rx="1" fill="#66bb6a" opacity="0.7">
    <animate attributeName="y" values="20;280" dur="4.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0" dur="4.5s" repeatCount="indefinite"/>
  </rect>
  <rect x="350" y="40" width="5" height="5" rx="1" fill="#ffd54f" opacity="0.5">
    <animate attributeName="y" values="40;290" dur="5.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0" dur="5.5s" repeatCount="indefinite"/>
  </rect>
  <circle cx="100" cy="50" r="3" fill="#ff8a65" opacity="0.6">
    <animate attributeName="cy" values="50;280" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="250" cy="15" r="2.5" fill="#ab47bc" opacity="0.5">
    <animate attributeName="cy" values="15;285" dur="6.5s" repeatCount="indefinite"/>
  </circle>
  <!-- Trophy -->
  <g transform="translate(160, 50)">
    <!-- Cup -->
    <path d="M20,0 L60,0 L55,50 Q40,65 25,50 Z" fill="url(#trophy)" stroke="#f57f17" stroke-width="1.5"/>
    <!-- Left handle -->
    <path d="M20,10 Q5,10 5,25 Q5,40 20,40" fill="none" stroke="url(#trophy)" stroke-width="3"/>
    <!-- Right handle -->
    <path d="M60,10 Q75,10 75,25 Q75,40 60,40" fill="none" stroke="url(#trophy)" stroke-width="3"/>
    <!-- Base -->
    <rect x="30" y="55" width="20" height="8" rx="2" fill="#f9a825"/>
    <rect x="22" y="63" width="36" height="6" rx="2" fill="#f57f17"/>
    <!-- Star on trophy -->
    <polygon points="40,15 43,25 53,25 45,31 48,41 40,35 32,41 35,31 27,25 37,25" fill="#fff" opacity="0.5">
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="2s" repeatCount="indefinite"/>
    </polygon>
    <!-- Glow -->
    <circle cx="40" cy="30" r="40" fill="#ffd54f" opacity="0.05">
      <animate attributeName="r" values="40;55;40" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.05;0.1;0.05" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
  <!-- Question mark -->
  <g transform="translate(55, 100)">
    <text x="0" y="50" fill="#4fc3f7" font-family="Arial" font-size="60" font-weight="bold" opacity="0.6">
      ?
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="3s" repeatCount="indefinite"/>
    </text>
  </g>
  <!-- Checkmark animated -->
  <g transform="translate(300, 120)">
    <circle cx="25" cy="25" r="22" fill="none" stroke="#66bb6a" stroke-width="3" opacity="0.7"/>
    <path d="M13,25 L22,34 L38,16" fill="none" stroke="#66bb6a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <animate attributeName="stroke-dasharray" values="0 50;50 0" dur="2s" repeatCount="indefinite"/>
    </path>
  </g>
  <!-- Progress bar -->
  <rect x="100" y="180" width="200" height="12" rx="6" fill="#263238" stroke="#37474f" stroke-width="1"/>
  <rect x="100" y="180" width="0" height="12" rx="6" fill="#4fc3f7">
    <animate attributeName="width" values="0;200" dur="4s" repeatCount="indefinite"/>
  </rect>
  <!-- Score text -->
  <text x="200" y="210" text-anchor="middle" fill="#4fc3f7" font-family="Arial" font-size="14" opacity="0.7">
    Puntuación:
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
  </text>
  <!-- Option buttons -->
  <g transform="translate(80, 225)">
    <rect x="0" y="0" width="100" height="25" rx="12" fill="none" stroke="#66bb6a" stroke-width="1.5" opacity="0.5"/>
    <text x="50" y="17" text-anchor="middle" fill="#66bb6a" font-family="Arial" font-size="11" opacity="0.6">Opcion A</text>
  </g>
  <g transform="translate(220, 225)">
    <rect x="0" y="0" width="100" height="25" rx="12" fill="none" stroke="#ff8a65" stroke-width="1.5" opacity="0.5"/>
    <text x="50" y="17" text-anchor="middle" fill="#ff8a65" font-family="Arial" font-size="11" opacity="0.6">Opcion B</text>
  </g>
  <!-- Blinking select on A -->
  <rect x="80" y="225" width="100" height="25" rx="12" fill="#66bb6a" opacity="0">
    <animate attributeName="opacity" values="0;0.2;0" dur="4s" repeatCount="indefinite"/>
  </rect>
  <text x="200" y="290" text-anchor="middle" fill="#ffd54f" font-family="Arial, sans-serif" font-size="13" font-weight="bold" letter-spacing="2">DESAFIO QUIZ</text>
</svg>
