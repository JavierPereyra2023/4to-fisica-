<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200">
  <rect width="300" height="200" fill="#0d1b2a"/>
  <!-- Main circuit -->
  <path d="M40,100 L40,35 L260,35 L260,100 L260,165 L40,165 L40,100" fill="none" stroke="#4fc3f7" stroke-width="2" opacity="0.6"/>
  <!-- Battery -->
  <line x1="30" y1="85" x2="50" y2="85" stroke="#ffd54f" stroke-width="3"/>
  <line x1="34" y1="115" x2="46" y2="115" stroke="#ffd54f" stroke-width="2"/>
  <text x="24" y="82" fill="#ffd54f" font-size="7" font-family="Arial">+</text>
  <!-- R1 -->
  <rect x="80" y="25" width="40" height="20" rx="3" fill="none" stroke="#ff8a65" stroke-width="2"/>
  <text x="100" y="39" text-anchor="middle" fill="#ff8a65" font-size="9" font-family="Arial" font-weight="bold">R₁</text>
  <!-- R2 -->
  <rect x="140" y="25" width="40" height="20" rx="3" fill="none" stroke="#66bb6a" stroke-width="2"/>
  <text x="160" y="39" text-anchor="middle" fill="#66bb6a" font-size="9" font-family="Arial" font-weight="bold">R₂</text>
  <!-- R3 -->
  <rect x="200" y="25" width="40" height="20" rx="3" fill="none" stroke="#ab47bc" stroke-width="2"/>
  <text x="220" y="39" text-anchor="middle" fill="#ab47bc" font-size="9" font-family="Arial" font-weight="bold">R₃</text>
  <!-- Electrons -->
  <circle r="3" fill="#4fc3f7" opacity="0.9">
    <animateMotion path="M40,100 L40,35 L260,35 L260,100 L260,165 L40,165 L40,100" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle r="2.5" fill="#4fc3f7" opacity="0.7">
    <animateMotion path="M40,100 L40,35 L260,35 L260,100 L260,165 L40,165 L40,100" dur="5s" repeatCount="indefinite" begin="1.6s"/>
  </circle>
  <circle r="2.5" fill="#4fc3f7" opacity="0.6">
    <animateMotion path="M40,100 L40,35 L260,35 L260,100 L260,165 L40,165 L40,100" dur="5s" repeatCount="indefinite" begin="3.3s"/>
  </circle>
  <!-- Same current indicator -->
  <text x="150" y="80" text-anchor="middle" fill="#4fc3f7" font-size="8" font-family="Arial" opacity="0.6">misma I →</text>
  <!-- Formula -->
  <text x="150" y="130" text-anchor="middle" fill="#ff8a65" font-size="11" font-family="Arial" font-weight="bold" opacity="0.8">
    R_T = R₁ + R₂ + R₃
    <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
  </text>
  <text x="150" y="188" text-anchor="middle" fill="#4fc3f7" font-size="10" font-family="Arial" font-weight="bold" letter-spacing="1">CIRCUITO SERIE</text>
</svg>
