<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200">
  <rect width="300" height="200" fill="#0d1b2a"/>

  <!-- Battery (left side) -->
  <line x1="35" y1="55" x2="35" y2="145" stroke="#4fc3f7" stroke-width="2" opacity="0.6"/>
  <!-- Battery positive plate -->
  <line x1="25" y1="80" x2="45" y2="80" stroke="#ffd54f" stroke-width="3"/>
  <text x="48" y="78" fill="#ffd54f" font-size="9" font-family="Arial" font-weight="bold">+</text>
  <!-- Battery negative plate -->
  <line x1="29" y1="92" x2="41" y2="92" stroke="#ffd54f" stroke-width="2"/>
  <text x="48" y="96" fill="#ffd54f" font-size="10" font-family="Arial" font-weight="bold">−</text>

  <!-- Top horizontal wire (from battery to junction) -->
  <line x1="35" y1="55" x2="100" y2="55" stroke="#4fc3f7" stroke-width="2" opacity="0.6"/>
  <!-- Junction node left -->
  <circle cx="100" cy="55" r="3" fill="#4fc3f7" opacity="0.7"/>

  <!-- Bottom horizontal wire (from battery to junction) -->
  <line x1="35" y1="145" x2="100" y2="145" stroke="#4fc3f7" stroke-width="2" opacity="0.6"/>
  <!-- Junction node left bottom -->
  <circle cx="100" cy="145" r="3" fill="#4fc3f7" opacity="0.7"/>

  <!-- Branch 1 (top) - R1 -->
  <line x1="100" y1="55" x2="145" y2="55" stroke="#4fc3f7" stroke-width="1.5" opacity="0.5"/>
  <rect x="145" y="43" width="45" height="24" rx="4" fill="none" stroke="#ff8a65" stroke-width="2"/>
  <text x="167" y="59" text-anchor="middle" fill="#ff8a65" font-size="11" font-family="Arial" font-weight="bold">R₁</text>
  <line x1="190" y1="55" x2="230" y2="55" stroke="#4fc3f7" stroke-width="1.5" opacity="0.5"/>

  <!-- Branch 2 (middle) - R2 -->
  <line x1="100" y1="55" x2="100" y2="100" stroke="#4fc3f7" stroke-width="1.5" opacity="0.5"/>
  <line x1="100" y1="100" x2="145" y2="100" stroke="#4fc3f7" stroke-width="1.5" opacity="0.5"/>
  <rect x="145" y="88" width="45" height="24" rx="4" fill="none" stroke="#66bb6a" stroke-width="2"/>
  <text x="167" y="104" text-anchor="middle" fill="#66bb6a" font-size="11" font-family="Arial" font-weight="bold">R₂</text>
  <line x1="190" y1="100" x2="230" y2="100" stroke="#4fc3f7" stroke-width="1.5" opacity="0.5"/>
  <line x1="230" y1="100" x2="230" y2="55" stroke="#4fc3f7" stroke-width="1.5" opacity="0.5"/>

  <!-- Branch 3 (bottom) - R3 -->
  <line x1="100" y1="100" x2="100" y2="145" stroke="#4fc3f7" stroke-width="1.5" opacity="0.5"/>
  <line x1="100" y1="145" x2="145" y2="145" stroke="#4fc3f7" stroke-width="1.5" opacity="0.5"/>
  <rect x="145" y="133" width="45" height="24" rx="4" fill="none" stroke="#ab47bc" stroke-width="2"/>
  <text x="167" y="149" text-anchor="middle" fill="#ab47bc" font-size="11" font-family="Arial" font-weight="bold">R₃</text>
  <line x1="190" y1="145" x2="230" y2="145" stroke="#4fc3f7" stroke-width="1.5" opacity="0.5"/>
  <line x1="230" y1="145" x2="230" y2="55" stroke="#4fc3f7" stroke-width="1.5" opacity="0.5"/>

  <!-- Junction node right -->
  <circle cx="230" cy="55" r="3" fill="#4fc3f7" opacity="0.7"/>

  <!-- Right side return wire -->
  <line x1="230" y1="55" x2="270" y2="55" stroke="#4fc3f7" stroke-width="2" opacity="0.6"/>
  <line x1="270" y1="55" x2="270" y2="145" stroke="#4fc3f7" stroke-width="2" opacity="0.6"/>
  <line x1="270" y1="145" x2="230" y2="145" stroke="#4fc3f7" stroke-width="2" opacity="0.6"/>

  <!-- Current arrows on each branch -->
  <!-- Arrow branch 1 -->
  <polygon points="140,52 135,55 140,58" fill="#ff8a65" opacity="0.8">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="1.2s" repeatCount="indefinite"/>
  </polygon>
  <!-- Arrow branch 2 -->
  <polygon points="140,97 135,100 140,103" fill="#66bb6a" opacity="0.8">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="1.2s" repeatCount="indefinite" begin="0.4s"/>
  </polygon>
  <!-- Arrow branch 3 -->
  <polygon points="140,142 135,145 140,148" fill="#ab47bc" opacity="0.8">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="1.2s" repeatCount="indefinite" begin="0.8s"/>
  </polygon>

  <!-- Electron flow on branch 1 -->
  <circle r="3" fill="#ff8a65" opacity="0.9">
    <animate attributeName="cx" values="105;167;225" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="55;55;55" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Electron flow on branch 2 -->
  <circle r="3" fill="#66bb6a" opacity="0.9">
    <animate attributeName="cx" values="105;167;225" dur="2s" repeatCount="indefinite" begin="0.3s"/>
    <animate attributeName="cy" values="100;100;100" dur="2s" repeatCount="indefinite" begin="0.3s"/>
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite" begin="0.3s"/>
  </circle>

  <!-- Electron flow on branch 3 -->
  <circle r="3" fill="#ab47bc" opacity="0.9">
    <animate attributeName="cx" values="105;167;225" dur="2s" repeatCount="indefinite" begin="0.6s"/>
    <animate attributeName="cy" values="145;145;145" dur="2s" repeatCount="indefinite" begin="0.6s"/>
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite" begin="0.6s"/>
  </circle>

  <!-- Labels -->
  <text x="67" y="48" text-anchor="middle" fill="#4fc3f7" font-size="8" font-family="Arial" font-weight="bold" opacity="0.7">I total</text>
  <text x="67" y="160" text-anchor="middle" fill="#4fc3f7" font-size="7" font-family="Arial" opacity="0.5">mismo V</text>

  <!-- Title -->
  <text x="150" y="190" text-anchor="middle" fill="#4fc3f7" font-size="10" font-family="Arial" font-weight="bold" letter-spacing="1">CIRCUITO PARALELO</text>
</svg>
