<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200">
  <rect width="300" height="200" fill="#0d1b2a"/>
  <!-- Positive charge (left) -->
  <circle cx="90" cy="90" r="22" fill="#e53935" opacity="0.15">
    <animate attributeName="r" values="22;30;22" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="90" cy="90" r="18" fill="none" stroke="#e53935" stroke-width="2"/>
  <text x="90" y="95" text-anchor="middle" fill="#e53935" font-size="18" font-family="Arial" font-weight="bold">+</text>
  <text x="90" y="125" text-anchor="middle" fill="#e53935" font-size="9" font-family="Arial">q₁</text>
  <!-- Positive charge (right) -->
  <circle cx="210" cy="90" r="22" fill="#e53935" opacity="0.15">
    <animate attributeName="r" values="22;30;22" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="210" cy="90" r="18" fill="none" stroke="#e53935" stroke-width="2"/>
  <text x="210" y="95" text-anchor="middle" fill="#e53935" font-size="18" font-family="Arial" font-weight="bold">+</text>
  <text x="210" y="125" text-anchor="middle" fill="#e53935" font-size="9" font-family="Arial">q₂</text>
  <!-- Repulsion arrows -->
  <line x1="112" y1="90" x2="135" y2="90" stroke="#ff8a65" stroke-width="2" marker-start="url(#arrowLeft)">
    <animate attributeName="x2" values="135;125;135" dur="1.5s" repeatCount="indefinite"/>
  </line>
  <line x1="188" y1="90" x2="165" y2="90" stroke="#ff8a65" stroke-width="2" marker-start="url(#arrowRight)">
    <animate attributeName="x2" values="165;175;165" dur="1.5s" repeatCount="indefinite"/>
  </line>
  <!-- Arrow markers -->
  <defs>
    <marker id="arrowLeft" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="8,0 0,3 8,6" fill="#ff8a65"/>
    </marker>
    <marker id="arrowRight" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#ff8a65"/>
    </marker>
  </defs>
  <!-- Force label -->
  <text x="150" y="80" text-anchor="middle" fill="#ff8a65" font-size="10" font-family="Arial" font-weight="bold">
    F ←→ F
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
  </text>
  <!-- Distance -->
  <line x1="90" y1="140" x2="210" y2="140" stroke="#4fc3f7" stroke-width="1" stroke-dasharray="4,3" opacity="0.5"/>
  <text x="150" y="155" text-anchor="middle" fill="#4fc3f7" font-size="9" font-family="Arial" opacity="0.7">r</text>
  <!-- Field lines radiating -->
  <g opacity="0.15">
    <line x1="90" y1="65" x2="90" y2="50" stroke="#e53935" stroke-width="1"/>
    <line x1="70" y1="75" x2="58" y2="65" stroke="#e53935" stroke-width="1"/>
    <line x1="65" y1="90" x2="50" y2="90" stroke="#e53935" stroke-width="1"/>
    <line x1="210" y1="65" x2="210" y2="50" stroke="#e53935" stroke-width="1"/>
    <line x1="230" y1="75" x2="242" y2="65" stroke="#e53935" stroke-width="1"/>
    <line x1="235" y1="90" x2="250" y2="90" stroke="#e53935" stroke-width="1"/>
  </g>
  <text x="150" y="185" text-anchor="middle" fill="#ff8a65" font-size="10" font-family="Arial" font-weight="bold" letter-spacing="1">LEY DE COULOMB</text>
</svg>
