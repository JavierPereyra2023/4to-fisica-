<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200">
  <rect width="300" height="200" fill="#0d1b2a"/>
  <!-- Circuit path -->
  <path d="M60,100 L60,40 L240,40 L240,100 L240,160 L60,160 L60,100" fill="none" stroke="#4fc3f7" stroke-width="2.5" opacity="0.7"/>
  <!-- Battery (left) -->
  <line x1="50" y1="85" x2="70" y2="85" stroke="#ffd54f" stroke-width="3"/>
  <line x1="54" y1="115" x2="66" y2="115" stroke="#ffd54f" stroke-width="2"/>
  <text x="42" y="82" fill="#ffd54f" font-size="8" font-family="Arial">+</text>
  <text x="42" y="122" fill="#ffd54f" font-size="8" font-family="Arial">−</text>
  <!-- Resistor (top) -->
  <path d="M110,40 L118,40 L122,28 L130,52 L138,28 L146,52 L154,28 L162,52 L166,40 L174,40" fill="none" stroke="#ff8a65" stroke-width="2"/>
  <text x="132" y="22" text-anchor="middle" fill="#ff8a65" font-size="10" font-family="Arial" font-weight="bold">R</text>
  <!-- Lightbulb (right) -->
  <circle cx="240" cy="100" r="15" fill="none" stroke="#ffd54f" stroke-width="2">
    <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="240" cy="100" r="20" fill="#ffd54f" opacity="0.06">
    <animate attributeName="r" values="20;30;20" dur="1.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.04;0.12;0.04" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <path d="M236,106 Q238,98 240,106 Q242,98 244,106" fill="none" stroke="#ffd54f" stroke-width="1.5">
    <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="1.5s" repeatCount="indefinite"/>
  </path>
  <!-- Electrons flowing -->
  <circle r="3" fill="#4fc3f7" opacity="0.9">
    <animateMotion path="M60,100 L60,40 L240,40 L240,100 L240,160 L60,160 L60,100" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle r="2.5" fill="#4fc3f7" opacity="0.7">
    <animateMotion path="M60,100 L60,40 L240,40 L240,100 L240,160 L60,160 L60,100" dur="4s" repeatCount="indefinite" begin="1.3s"/>
  </circle>
  <circle r="2.5" fill="#4fc3f7" opacity="0.6">
    <animateMotion path="M60,100 L60,40 L240,40 L240,100 L240,160 L60,160 L60,100" dur="4s" repeatCount="indefinite" begin="2.6s"/>
  </circle>
  <!-- Labels -->
  <text x="60" y="105" text-anchor="middle" fill="#ffd54f" font-size="9" font-family="Arial" font-weight="bold">V</text>
  <text x="150" y="185" text-anchor="middle" fill="#4fc3f7" font-size="11" font-family="Arial" font-weight="bold">V = I . R</text>
</svg>
