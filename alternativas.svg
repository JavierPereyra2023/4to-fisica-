<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1b2a"/>
      <stop offset="60%" stop-color="#1b2838"/>
      <stop offset="100%" stop-color="#263238"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd54f"/>
      <stop offset="100%" stop-color="#ff8f00"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1565c0"/>
      <stop offset="100%" stop-color="#0d47a1"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#sky)"/>
  <!-- Stars -->
  <circle cx="30" cy="20" r="1" fill="#fff" opacity="0.4"/>
  <circle cx="370" cy="35" r="1.2" fill="#fff" opacity="0.5"/>
  <circle cx="180" cy="15" r="1" fill="#fff" opacity="0.3"/>
  <!-- Sun -->
  <circle cx="320" cy="60" r="30" fill="url(#sun)" opacity="0.9">
    <animate attributeName="r" values="30;33;30" dur="3s" repeatCount="indefinite"/>
  </circle>
  <!-- Sun rays -->
  <g opacity="0.4">
    <line x1="320" y1="20" x2="320" y2="10" stroke="#ffd54f" stroke-width="2">
      <animate attributeName="y2" values="10;5;10" dur="2s" repeatCount="indefinite"/>
    </line>
    <line x1="355" y1="35" x2="365" y2="30" stroke="#ffd54f" stroke-width="2"/>
    <line x1="285" y1="35" x2="275" y2="30" stroke="#ffd54f" stroke-width="2"/>
    <line x1="350" y1="80" x2="360" y2="85" stroke="#ffd54f" stroke-width="2"/>
    <line x1="290" y1="80" x2="280" y2="85" stroke="#ffd54f" stroke-width="2"/>
  </g>
  <!-- Ground -->
  <rect x="0" y="230" width="400" height="70" fill="#1a2f1a"/>
  <rect x="0" y="230" width="400" height="5" fill="#2e7d32" opacity="0.3"/>

  <!-- Wind turbine 1 (big) -->
  <!-- Pole -->
  <rect x="78" y="120" width="4" height="115" fill="#b0bec5"/>
  <!-- Blades rotating around hub point (80, 120) -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 80 120" to="360 80 120" dur="4s" repeatCount="indefinite"/>
    <!-- Hub -->
    <circle cx="80" cy="120" r="4" fill="#cfd8dc"/>
    <!-- Blade 1 (up) -->
    <ellipse cx="80" cy="78" rx="5" ry="40" fill="#b0bec5" opacity="0.85"/>
    <!-- Blade 2 (lower-right) -->
    <ellipse cx="80" cy="78" rx="5" ry="40" fill="#b0bec5" opacity="0.85" transform="rotate(120 80 120)"/>
    <!-- Blade 3 (lower-left) -->
    <ellipse cx="80" cy="78" rx="5" ry="40" fill="#b0bec5" opacity="0.85" transform="rotate(240 80 120)"/>
  </g>

  <!-- Wind turbine 2 (smaller, background) -->
  <rect x="148" y="150" width="3" height="85" fill="#78909c" opacity="0.6"/>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 150 150" to="360 150 150" dur="5.5s" repeatCount="indefinite"/>
    <circle cx="150" cy="150" r="3" fill="#90a4ae"/>
    <ellipse cx="150" cy="120" rx="4" ry="28" fill="#90a4ae" opacity="0.7"/>
    <ellipse cx="150" cy="120" rx="4" ry="28" fill="#90a4ae" opacity="0.7" transform="rotate(120 150 150)"/>
    <ellipse cx="150" cy="120" rx="4" ry="28" fill="#90a4ae" opacity="0.7" transform="rotate(240 150 150)"/>
  </g>

  <!-- Solar panels -->
  <g transform="translate(220, 200)">
    <rect x="0" y="0" width="35" height="25" rx="2" fill="url(#panel)" stroke="#1976d2" stroke-width="1"/>
    <line x1="12" y1="0" x2="12" y2="25" stroke="#0d47a1" stroke-width="0.5"/>
    <line x1="23" y1="0" x2="23" y2="25" stroke="#0d47a1" stroke-width="0.5"/>
    <line x1="0" y1="8" x2="35" y2="8" stroke="#0d47a1" stroke-width="0.5"/>
    <line x1="0" y1="16" x2="35" y2="16" stroke="#0d47a1" stroke-width="0.5"/>
    <rect x="0" y="0" width="5" height="25" rx="1" fill="#fff" opacity="0.15">
      <animate attributeName="x" values="-5;40" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.2;0" dur="3s" repeatCount="indefinite"/>
    </rect>
  </g>
  <g transform="translate(260, 195)">
    <rect x="0" y="0" width="35" height="25" rx="2" fill="url(#panel)" stroke="#1976d2" stroke-width="1"/>
    <line x1="12" y1="0" x2="12" y2="25" stroke="#0d47a1" stroke-width="0.5"/>
    <line x1="23" y1="0" x2="23" y2="25" stroke="#0d47a1" stroke-width="0.5"/>
    <line x1="0" y1="8" x2="35" y2="8" stroke="#0d47a1" stroke-width="0.5"/>
    <line x1="0" y1="16" x2="35" y2="16" stroke="#0d47a1" stroke-width="0.5"/>
    <rect x="0" y="0" width="5" height="25" rx="1" fill="#fff" opacity="0.15">
      <animate attributeName="x" values="-5;40" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.2;0" dur="3.5s" repeatCount="indefinite"/>
    </rect>
  </g>
  <!-- Water waves -->
  <path d="M0,260 Q30,250 60,260 Q90,270 120,260 Q150,250 180,260" fill="none" stroke="#4fc3f7" stroke-width="2" opacity="0.4">
    <animate attributeName="d" values="M0,260 Q30,250 60,260 Q90,270 120,260 Q150,250 180,260;M0,260 Q30,270 60,260 Q90,250 120,260 Q150,270 180,260;M0,260 Q30,250 60,260 Q90,270 120,260 Q150,250 180,260" dur="2.5s" repeatCount="indefinite"/>
  </path>
  <!-- Leaf -->
  <g transform="translate(35, 250)" opacity="0.6">
    <path d="M0,15 Q5,-5 20,0 Q15,10 5,15 Z" fill="#66bb6a">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
    </path>
    <line x1="5" y1="14" x2="15" y2="4" stroke="#388e3c" stroke-width="0.8"/>
  </g>
  <text x="200" y="285" text-anchor="middle" fill="#66bb6a" font-family="Arial, sans-serif" font-size="13" font-weight="bold" letter-spacing="2">ENERGIAS ALTERNATIVAS</text>
</svg>
